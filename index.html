<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TravelGo | Flight Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-body-tertiary">

<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary fs-4" href="index.html">TravelGo</a>
        <div class="navbar-nav ms-auto flex-row flex-wrap">
            <a class="nav-link" href="flight.html">Flights</a>
            <a class="nav-link" href="hotels.html">Hotels</a>
            <a class="nav-link" href="holiday.html">Packages</a>
        </div>
    </div>
</nav>


<main class="container py-5">

    <div class="text-center mb-4">
        <h2 class="fw-bold">Where would you like to go?</h2>
        <p class="text-secondary">Search flights and plan your next journey.</p>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <ul class="nav nav-pills nav-fill gap-2">
                <li class="nav-item"><a class="nav-link active" href="index.html">Flights</a></li>
                <li class="nav-item"><a class="nav-link" href="hotels.html">Hotels</a></li>
                <li class="nav-item"><a class="nav-link" href="Trains.html">Trains</a></li>
                <li class="nav-item"><a class="nav-link" href="Buses.html">Buses</a></li>
                <li class="nav-item"><a class="nav-link" href="holiday.html">Packages</a></li>
            </ul>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-3">Search Flights</h5>

            <form id="flightSearchForm" class="needs-validation" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="fromCity">From City</label>
                        <input type="text" id="fromCity" class="form-control" placeholder="Departure city" required>
                        <div class="invalid-feedback">Enter departure city.</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="toCity">To City</label>
                        <input type="text" id="toCity" class="form-control" placeholder="Destination city" required>
                        <div class="invalid-feedback">Enter destination city.</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="departureDate">Departure Date</label>
                        <input type="date" id="departureDate" class="form-control" required>
                        <div class="invalid-feedback">Select departure date.</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="returnDate">Return Date</label>
                        <input type="date" id="returnDate" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="adults">Adults</label>
                        <select id="adults" class="form-select" required>
                            <option value="" selected disabled>Select Adults</option>
                            <option value="1">1 Adult</option>
                            <option value="2">2 Adults</option>
                            <option value="3">3 Adults</option>
                            <option value="4">4 Adults</option>
                        </select>
                        <div class="invalid-feedback">Select adults.</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="travelClass">Travel Class</label>
                        <select id="travelClass" class="form-select">
                            <option value="Economy">Economy</option>
                            <option value="Premium Economy">Premium Economy</option>
                            <option value="Business">Business</option>
                            <option value="First Class">First Class</option>
                        </select>
                    </div>
                </div>

                <hr class="my-4">
                <div class="text-end">
                    <button class="btn btn-primary px-4" type="submit">Search Flights</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script>
const form = document.getElementById("flightSearchForm");
const departure = document.getElementById("departureDate");
const returnDate = document.getElementById("returnDate");

departure.min = new Date().toISOString().split("T")[0];

departure.addEventListener("change", () => {
    returnDate.min = departure.value;
    if (returnDate.value && returnDate.value < departure.value) returnDate.value = "";
});

form.addEventListener("submit", event => {
    event.preventDefault();

    const from = document.getElementById("fromCity").value.trim();
    const to = document.getElementById("toCity").value.trim();

    if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
    }

    if (from.toLowerCase() === to.toLowerCase()) {
        alert("Departure and destination cannot be the same.");
        return;
    }

    const params = new URLSearchParams({
        from,
        to,
        departure: departure.value,
        returnDate: returnDate.value,
        adults: document.getElementById("adults").value,
        travelClass: document.getElementById("travelClass").value
    });

    window.location.href = "results.html?" + params;
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

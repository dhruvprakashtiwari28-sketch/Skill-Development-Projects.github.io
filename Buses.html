<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TravelGo | Buses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary">
    
<nav class="navbar bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">TravelGo</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" href="index.html">Flights</a>
            <a class="nav-link" href="hotels.html">Hotels</a>
            <a class="nav-link" href="Trains.html">Trains</a>
            <a class="nav-link active" href="Buses.html">Buses</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <h2 class="text-center fw-bold mb-4">Book Bus Tickets</h2>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form id="busForm" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">From</label>
                    <input id="from" class="form-control" placeholder="Departure city" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">To</label>
                    <input id="to" class="form-control" placeholder="Destination city" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Journey Date</label>
                    <input type="date" id="date" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Bus Type</label>
                    <select id="busType" class="form-select">
                        <option>AC Sleeper</option>
                        <option>Non-AC Sleeper</option>
                        <option>AC Seater</option>
                        <option>Non-AC Seater</option>
                    </select>
                </div>
                <div class="col-12 text-end">
                    <button class="btn btn-primary">Search Buses</button>
                </div>
            </form>
        </div>
    </div>

    <div id="busResults" class="mt-4"></div>

    <h5 class="fw-bold mt-5 mb-3">Popular Bus Routes</h5>
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card h-100"><div class="card-body">
                <h5>Bengaluru – Chennai</h5>
                <p>AC Sleeper</p>
                <span class="badge text-bg-primary">From ₹650</span>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card h-100"><div class="card-body">
                <h5>Bengaluru – Hyderabad</h5>
                <p>AC Seater</p>
                <span class="badge text-bg-primary">From ₹800</span>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card h-100"><div class="card-body">
                <h5>Delhi – Jaipur</h5>
                <p>Non-AC Seater</p>
                <span class="badge text-bg-primary">From ₹350</span>
            </div></div>
        </div>
    </div>
</main>

<script>
const form = document.getElementById("busForm");
const date = document.getElementById("date");
date.min = new Date().toISOString().split("T")[0];

form.addEventListener("submit", e => {
    e.preventDefault();
    if (!form.reportValidity()) return;

    const from = document.getElementById("from").value.trim();
    const to = document.getElementById("to").value.trim();

    if (from.toLowerCase() === to.toLowerCase()) {
        alert("Choose different departure and destination cities.");
        return;
    }

    const results = document.getElementById("busResults");
    results.replaceChildren();

    const card = document.createElement("div");
    card.className = "card border-0 shadow-sm";
    card.innerHTML = `
        <div class="card-body">
            <h5 class="fw-bold">Your Bus Search</h5>
            <p class="mb-2">From: ${from} | To: ${to}</p>
            <p class="mb-2">Date: ${date.value} | Type: ${document.getElementById("busType").value}</p>
            <div class="alert alert-info mb-0">Live bus schedules, fares and seat availability are not connected yet.</div>
        </div>`;
    results.appendChild(card);
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TravelGo | Trains</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary">

<nav class="navbar bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">TravelGo</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" href="index.html">Flights</a>
            <a class="nav-link" href="hotels.html">Hotels</a>
            <a class="nav-link active" href="Trains.html">Trains</a>
            <a class="nav-link" href="Buses.html">Buses</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <h2 class="text-center fw-bold mb-4">Book Train Tickets</h2>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form id="trainForm" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">From</label>
                    <input id="from" class="form-control" placeholder="Departure station" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">To</label>
                    <input id="to" class="form-control" placeholder="Destination station" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Journey Date</label>
                    <input type="date" id="date" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Class</label>
                    <select id="class" class="form-select">
                        <option>Sleeper</option>
                        <option>3 AC</option>
                        <option>2 AC</option>
                        <option>1 AC</option>
                    </select>
                </div>
                <div class="col-12 text-end">
                    <button class="btn btn-primary">Search Trains</button>
                </div>
            </form>
        </div>
    </div>

    <div id="trainResults" class="mt-4"></div>

    <h5 class="fw-bold mt-5 mb-3">Popular Routes</h5>
    <div class="row g-3">
        <div class="col-md-4"><div class="card h-100"><div class="card-body">
            <h5>Bengaluru – Chennai</h5>
            <p>Intercity Express</p><span class="badge text-bg-primary">From ₹450</span>
        </div></div></div>
        <div class="col-md-4"><div class="card h-100"><div class="card-body">
            <h5>Delhi – Lucknow</h5>
            <p>Shatabdi Express</p><span class="badge text-bg-primary">From ₹750</span>
        </div></div></div>
        <div class="col-md-4"><div class="card h-100"><div class="card-body">
            <h5>Mumbai – Pune</h5>
            <p>Intercity Express</p><span class="badge text-bg-primary">From ₹300</span>
        </div></div></div>
    </div>
</main>

<script>
const form = document.getElementById("trainForm");
const date = document.getElementById("date");
date.min = new Date().toISOString().split("T")[0];

form.addEventListener("submit", e => {
    e.preventDefault();
    if (!form.reportValidity()) return;

    const from = document.getElementById("from").value.trim();
    const to = document.getElementById("to").value.trim();

    if (from.toLowerCase() === to.toLowerCase()) {
        alert("Choose different stations.");
        return;
    }

    const results = document.getElementById("trainResults");
    results.innerHTML = `<div class="card shadow-sm border-0"><div class="card-body">
        <h5 class="fw-bold">Your Train Search</h5>
        <p>From: ${from} | To: ${to}</p>
        <p>Date: ${date.value} | Class: ${document.getElementById("class").value}</p>
        <div class="alert alert-info mb-0">Live train schedules and seat availability are not connected yet.</div>
    </div></div>`;
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

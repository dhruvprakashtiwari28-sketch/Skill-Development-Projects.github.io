<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TravelGo | Hotels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-body-tertiary">

<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary fs-4" href="index.html">TravelGo</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="flight.html">Flights</a>
            <a class="nav-link active" href="hotels.html">Hotels</a>
            <a class="nav-link" href="holiday.html">Holiday Packages</a>
        </div>
    </div>
</nav>

<main class="container py-5">

    <div class="mb-4">
        <h2 class="fw-bold">Find Your Stay</h2>
        <p class="text-secondary">Discover comfortable stays for your next trip.</p>
    </div>

    <!-- Hotel Search -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-3">Search Hotels</h5>
            <form id="hotelForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="city">Destination</label>
                        <input type="text" id="city" class="form-control" placeholder="Enter city" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="checkin">Check-in</label>
                        <input type="date" id="checkin" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="checkout">Check-out</label>
                        <input type="date" id="checkout" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="guests">Guests</label>
                        <select id="guests" class="form-select">
                            <option value="1">1 Guest</option>
                            <option value="2" selected>2 Guests</option>
                            <option value="3">3 Guests</option>
                            <option value="4">4 Guests</option>
                        </select>
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <button class="btn btn-primary w-100" type="submit">Search Hotels</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Hotel Listings -->
    <h5 class="fw-bold mb-3">Popular Hotels</h5>
    <div class="row g-3">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <span class="badge text-bg-success">4 Star</span>
                    <h5 class="fw-bold mt-2">The Grand Palace</h5>
                    <p class="text-secondary">Bengaluru, Karnataka</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <strong class="text-primary">₹3,499 / night</strong>
                        <button class="btn btn-outline-primary btn-sm" onclick="selectHotel('The Grand Palace')">View Details</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <span class="badge text-bg-success">5 Star</span>
                    <h5 class="fw-bold mt-2">City Comfort Hotel</h5>
                    <p class="text-secondary">Delhi, India</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <strong class="text-primary">₹4,299 / night</strong>
                        <button class="btn btn-outline-primary btn-sm" onclick="selectHotel('City Comfort Hotel')">View Details</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="hotelMessage" class="alert alert-info mt-3 d-none"></div>

</main>

<script>
document.getElementById("checkin").min = new Date().toISOString().split("T")[0];

function selectHotel(name) {
    const message = document.getElementById("hotelMessage");
    message.textContent = name + " selected.";
    message.classList.remove("d-none");
}

document.getElementById("hotelForm").addEventListener("submit", function(event) {
    event.preventDefault();
    const checkin = document.getElementById("checkin").value;
    const checkout = document.getElementById("checkout").value;

    if (checkout <= checkin) {
        alert("Check-out must be after check-in.");
        return;
    }

    alert("Hotels searched successfully in " + document.getElementById("city").value + ".");
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
